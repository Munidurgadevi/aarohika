    <div class="auth-bg" aria-hidden="true">
        <span class="auth-blob b1"></span><span class="auth-blob b2"></span>
        <span class="auth-eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="auth-rise s1"><svg class="bi">
                <use href="#bi-music-note-beamed" />
            </svg></span>
        <span class="auth-rise s2"><svg class="bi">
                <use href="#bi-music-note" />
            </svg></span>
        <span class="auth-rise s3"><svg class="bi">
                <use href="#bi-music-note-beamed" />
            </svg></span>
        <span class="auth-rise s4"><svg class="bi">
                <use href="#bi-music-note" />
            </svg></span>
        <span class="auth-rise s5"><svg class="bi">
                <use href="#bi-music-note-beamed" />
            </svg></span>
        <span class="auth-dot d1"></span><span class="auth-dot d2"></span><span class="auth-dot d3"></span><span
            class="auth-dot d4"></span>
        <span class="auth-note n1">♪</span><span class="auth-note n2">♫</span>
    </div>

    <div class="auth-tools">
        <button class="icon-btn" id="dirToggle" type="button" aria-label="Switch RTL / LTR"><svg viewBox="0 0 24 24"
                aria-hidden="true">
                <path d="M8 3 4 7l4 4" />
                <path d="M4 7h16" />
                <path d="m16 21 4-4-4-4" />
                <path d="M20 17H4" />
            </svg></button>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle theme"><svg class="icon-moon"
                viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg><svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="m4.93 4.93 1.41 1.41" />
                <path d="m17.66 17.66 1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="m6.34 17.66-1.41 1.41" />
                <path d="m19.07 4.93-1.41 1.41" />
            </svg></button>
    </div>

    <main class="auth-page">
        <section class="auth-card" aria-labelledby="authTitle">
            <a class="brand auth-brand" href="home1.html" aria-label="Aarohika home"><span
                    class="brand-badge"></span><span class="brand-text"><span class="brand-title"><span
                            class="aaroh">Aaroh</span><span class="ika">ika</span></span><span class="brand-sub">Music
                        Academy</span></span></a>
            <div class="auth-head">
                <h1 class="auth-title caps" id="authTitle">Welcome <span>Back</span></h1>
                <p class="auth-lead">Sign in to continue your music journey.</p>
            </div>
            <form class="auth-form" data-next="dashboard.html">
                <div class="auth-field">
                    <label for="email">Email Address</label>
                    <div class="auth-input"><svg class="bi" aria-hidden="true">
                            <use href="#bi-envelope" />
                        </svg><input id="email" name="email" type="email" autocomplete="email"
                            placeholder="Enter your email address" required></div>
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <div class="auth-input"><svg class="bi" aria-hidden="true">
                            <use href="#bi-lock" />
                        </svg><input id="password" name="password" type="password" autocomplete="current-password"
                            placeholder="Enter your password" required><button class="auth-eye" type="button"
                            aria-label="Show password"><svg class="bi eye-on" aria-hidden="true">
                                <use href="#bi-eye" />
                            </svg><svg class="bi eye-off" aria-hidden="true">
                                <use href="#bi-eye-slash" />
                            </svg></button></div>
                </div>
                <div class="auth-meta">
                    <label class="auth-check"><input type="checkbox" name="remember">Remember Me</label>
                    <a class="auth-link" href="login.html">Forgot Password?</a>
                </div>
                <button class="auth-submit" type="submit">Login<svg class="bi rtl-flip" aria-hidden="true">
                        <use href="#bi-arrow-right" />
                    </svg></button>
                <div class="auth-divider">Or continue with</div>
                <div class="auth-social">
                    <button type="button"><svg viewBox="0 0 48 48" aria-hidden="true">
                            <path fill="#EA4335"
                                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                            <path fill="#4285F4"
                                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                            <path fill="#FBBC05"
                                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                            <path fill="#34A853"
                                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                        </svg>Google</button>
                    <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
                            <path
                                d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" />
                        </svg>Apple</button>
                </div>
            </form>
            <p class="auth-foot">Don't have an account? <a class="auth-link" href="register.html">Register</a></p>
        </section>
    </main>

    <script>
        (function () {
            var root = document.documentElement;

            function save(key, value) {
                try { localStorage.setItem(key, value); } catch (e) { }
            }

            // Theme toggle (same storage key as the rest of the site)
            var themeBtn = document.getElementById("themeToggle");
            if (themeBtn) {
                themeBtn.addEventListener("click", function () {
                    var dark = root.classList.toggle("dark-mode");
                    save("aarohika-theme", dark ? "dark" : "light");
                });
            }

            // RTL / LTR toggle
            var dirBtn = document.getElementById("dirToggle");
            var dirLabel = document.getElementById("dirLabel");
            function syncDir() {
                if (dirLabel) dirLabel.textContent = root.dir === "rtl" ? "LTR" : "RTL";
            }
            if (dirBtn) {
                dirBtn.addEventListener("click", function () {
                    root.dir = root.dir === "rtl" ? "ltr" : "rtl";
                    save("aarohika-dir", root.dir);
                    syncDir();
                });
            }
            syncDir();

            // Show / hide password
            document.querySelectorAll(".auth-eye").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var input = btn.parentElement.querySelector("input");
                    if (!input) return;
                    var show = input.type === "password";
                    input.type = show ? "text" : "password";
                    btn.classList.toggle("is-shown", show);
                    btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
                });
            });

            // Form handling (demo: connect to your backend where marked)
            var form = document.querySelector(".auth-form");
            if (form) {
                var pass = form.querySelector("#password");
                var confirm = form.querySelector("#confirmPassword");
                if (pass && confirm) {
                    var check = function () {
                        confirm.setCustomValidity(confirm.value && confirm.value !== pass.value ? "Passwords do not match" : "");
                    };
                    pass.addEventListener("input", check);
                    confirm.addEventListener("input", check);
                }
                form.addEventListener("submit", function (e) {
                    e.preventDefault();
                    // TODO: send form data to your server here, then redirect on success
                    window.location.href = form.getAttribute("data-next") || "home1.html";
                });
            }

        })();
    </script>
</body>

</html>
