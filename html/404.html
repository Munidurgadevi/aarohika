<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 | Page Not Found | Aarohika Music Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css?v=4">
    <link rel="stylesheet" href="../css/404.css">
    <link rel="icon" type="image/png" href="../css/image/lightmode.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="../css/image/darkmode.png" media="(prefers-color-scheme: dark)">
    <script>try {var d = document.documentElement, t = localStorage.getItem("aarohika-theme"), r = localStorage.getItem("aarohika-dir"); if (t === "dark") d.classList.add("dark-mode"); if (r) d.dir = r} catch (e) { }</script>
</head>

<body class="pg nf">
    <div class="nf-glow" aria-hidden="true"></div>
    <span class="nf-note n1" aria-hidden="true">♪</span>
    <span class="nf-note n2" aria-hidden="true">♫</span>

    <div class="pg-tools">
        <button class="icon-btn" id="dirToggle" type="button" aria-label="Switch RTL / LTR"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg></button>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
    </div>

    <main class="nf-main">
        <div class="pg-brand">
            <a class="brand" href="home1.html" aria-label="Aarohika home"><span class="brand-badge"><svg viewBox="0 0 48 48" aria-hidden="true">
                        <rect width="48" height="48" rx="12" fill="var(--logo-bg)" />
                        <path d="M20 32V14l13-3v18" stroke="var(--logo-stroke)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                        <circle cx="16" cy="32" r="5" fill="var(--logo-ball)" />
                        <circle cx="29" cy="29" r="5" fill="var(--logo-ball)" />
                    </svg></span><span class="brand-text"><span class="brand-title"><span class="aaroh">Aaroh</span><span class="ika">ika</span></span><span class="brand-sub">Music Academy</span></span></a>
        </div>

        <p class="nf-code" aria-hidden="true">404</p>
        <h1>Hit a <span>wrong note?</span></h1>
        <p class="nf-lead">The page you're looking for was moved or doesn't exist. Let's get you back to your musical journey.</p>

        <div class="nf-actions">
            <a class="pg-btn" href="home1.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.8 12 3.5l8.5 7.3V20a1 1 0 0 1-1 1h-4.7v-6.2H9.2V21H4.5a1 1 0 0 1-1-1z"/></svg>
                Back to Home
            </a>
            <a class="pg-btn is-ghost" href="contact.html">Contact Us</a>
        </div>
    </main>
    <script>
    (function () {
        var d = document.documentElement;
        document.getElementById("themeToggle").addEventListener("click", function () {
            var dark = d.classList.toggle("dark-mode");
            try { localStorage.setItem("aarohika-theme", dark ? "dark" : "light"); } catch (e) { }
        });
        document.getElementById("dirToggle").addEventListener("click", function () {
            d.dir = d.dir === "rtl" ? "ltr" : "rtl";
            try { localStorage.setItem("aarohika-dir", d.dir); } catch (e) { }
        });
    })();
    </script>
</body>

</html>
